[project]
name = "kriib-iris"
version = "1.0.0"
description = "Terminal UI library for CLI tools"
readme = "README.md"
authors = [{name = "Jeremy Albin", email = "jeremy.albin@kriib.com"}]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "iris", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "SIM108",  # Ternary operator - if/else often more readable
    "RUF022",  # __all__ sorting - categorical organization preferred
]

[tool.ruff.lint.isort]
known-first-party = ["iris"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
